name: Build APKs

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: |
          chmod +x dexterh4ck-equipos/gradlew
          chmod +x dexterh4ck-control/gradlew

      - name: Build Equipos APK
        run: cd dexterh4ck-equipos && ./gradlew assembleRelease

      - name: Build Control APK
        run: cd dexterh4ck-control && ./gradlew assembleRelease

      - name: Upload APKs
        uses: actions/upload-artifact@v3
        with:
          name: apks
          path: |
            dexterh4ck-equipos/app/build/outputs/apk/release/app-release.apk
            dexterh4ck-control/app/build/outputs/apk/release/app-release.apk
