name: Build and validate Android APKs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build, sign and validate both Android apps
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Android Gradle Plugin 8.2.0 requires Gradle 8.2 and JDK 17.
      # These projects do not contain a Gradle Wrapper, so install Gradle explicitly.
      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'
          cache-disabled: true

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          # GitHub's Ubuntu runner already provides Android SDK command-line tools.
          # Do not run android-actions/setup-android here: its default legacy
          # "tools" package no longer exists in Google's SDK repository.
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" -type f -name sdkmanager -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::No se encontró sdkmanager en el runner."
            exit 1
          fi

          # sdkmanager exits after accepting licenses; with pipefail, `yes` receives SIGPIPE.
          # Temporarily disable pipefail only for this expected early-close pipeline.
          set +o pipefail
          yes | "$SDKMANAGER" --licenses
          LICENSE_STATUS=${PIPESTATUS[1]}
          set -o pipefail
          if [ "$LICENSE_STATUS" -ne 0 ]; then
            echo "::error::No se pudieron aceptar las licencias del Android SDK."
            exit "$LICENSE_STATUS"
          fi
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"

      - name: Validate project files and expected Android configuration
        shell: bash
        run: |
          set -euo pipefail

          for project in dexterh4ck-equipos dexterh4ck-control; do
            test -f "$project/settings.gradle"
            test -f "$project/build.gradle"
            test -f "$project/gradle.properties"
            test -f "$project/app/build.gradle"
            test -f "$project/app/src/main/AndroidManifest.xml"
            test -d "$project/app/src/main"
          done

          grep -Fq 'id "com.android.application" version "8.2.0" apply false' dexterh4ck-equipos/build.gradle || grep -Fq "id 'com.android.application' version '8.2.0' apply false" dexterh4ck-equipos/build.gradle
          grep -Fq 'id "org.jetbrains.kotlin.android" version "1.9.22" apply false' dexterh4ck-equipos/build.gradle || grep -Fq "id 'org.jetbrains.kotlin.android' version '1.9.22' apply false" dexterh4ck-equipos/build.gradle

          grep -Fq 'applicationId "com.dexterh4ck.equipos"' dexterh4ck-equipos/app/build.gradle
          grep -Fq 'applicationId "com.dexterh4ck.control"' dexterh4ck-control/app/build.gradle
          grep -Fq 'compileSdk 34' dexterh4ck-equipos/app/build.gradle
          grep -Fq 'compileSdk 34' dexterh4ck-control/app/build.gradle
          grep -Fq 'targetSdk 34' dexterh4ck-equipos/app/build.gradle
          grep -Fq 'targetSdk 34' dexterh4ck-control/app/build.gradle
          grep -Fq 'signingConfig signingConfigs.debug' dexterh4ck-equipos/app/build.gradle
          grep -Fq 'signingConfig signingConfigs.debug' dexterh4ck-control/app/build.gradle

      - name: Build Dexterh4ck Equipos release APK
        run: gradle -p dexterh4ck-equipos --no-daemon --stacktrace clean assembleRelease

      - name: Build Dexterh4ck Control release APK
        run: gradle -p dexterh4ck-control --no-daemon --stacktrace clean assembleRelease

      - name: Verify APK signature, alignment, package and SDK metadata
        shell: bash
        run: |
          set -euo pipefail

          APKS=(
            "dexterh4ck-equipos/app/build/outputs/apk/release/app-release.apk"
            "dexterh4ck-control/app/build/outputs/apk/release/app-release.apk"
          )
          EXPECTED_PACKAGES=("com.dexterh4ck.equipos" "com.dexterh4ck.control")
          EXPECTED_MIN_SDKS=("21" "24")
          BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"

          for i in "${!APKS[@]}"; do
            apk="${APKS[$i]}"
            expected_package="${EXPECTED_PACKAGES[$i]}"
            expected_min_sdk="${EXPECTED_MIN_SDKS[$i]}"

            test -s "$apk"
            echo "::group::Validating $apk"

            "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$apk"
            "$BUILD_TOOLS/zipalign" -c -v 4 "$apk"

            metadata="$("$BUILD_TOOLS/aapt" dump badging "$apk")"
            printf '%s\n' "$metadata"

            grep -Fq "package: name='$expected_package'" <<< "$metadata"
            grep -Fq "sdkVersion:'$expected_min_sdk'" <<< "$metadata"
            grep -Fq "targetSdkVersion:'34'" <<< "$metadata"
            grep -q "^launchable-activity:" <<< "$metadata"

            echo "APK válido: $expected_package; minSdk=$expected_min_sdk; targetSdk=34"
            echo "::endgroup::"
          done

      - name: Upload validated APKs
        uses: actions/upload-artifact@v4
        with:
          name: dexterh4ck-apks-build-validated
          if-no-files-found: error
          retention-days: 30
          path: |
            dexterh4ck-equipos/app/build/outputs/apk/release/app-release.apk
            dexterh4ck-control/app/build/outputs/apk/release/app-release.apk
