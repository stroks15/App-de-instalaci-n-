name: Build APKs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Android applications
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # These projects contain Gradle build files but no Gradle Wrapper.
      # Install the Gradle version compatible with Android Gradle Plugin 8.2.0.
      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.2'
          cache-disabled: true

      - name: Validate Android project structure
        shell: bash
        run: |
          set -euo pipefail
          for project in dexterh4ck-equipos dexterh4ck-control; do
            test -f "$project/settings.gradle"
            test -f "$project/build.gradle"
            test -f "$project/app/build.gradle"
            test -d "$project/app/src"
          done

      - name: Set up Android SDK build tools
        uses: android-actions/setup-android@v3

      - name: Install APK validation tools
        run: sdkmanager "build-tools;35.0.0"

      - name: Build Dexterh4ck Equipos APK
        run: gradle -p dexterh4ck-equipos --no-daemon clean assembleRelease

      - name: Build Dexterh4ck Control APK
        run: gradle -p dexterh4ck-control --no-daemon clean assembleRelease

      - name: Verify APK signatures, alignment and package metadata
        shell: bash
        run: |
          set -euo pipefail
          APKS=(
            "dexterh4ck-equipos/app/build/outputs/apk/release/app-release.apk"
            "dexterh4ck-control/app/build/outputs/apk/release/app-release.apk"
          )
          EXPECTED_PACKAGES=("com.dexterh4ck.equipos" "com.dexterh4ck.control")
          for i in "${!APKS[@]}"; do
            apk="${APKS[$i]}"
            expected="${EXPECTED_PACKAGES[$i]}"
            test -s "$apk"
            echo "Validando $apk"
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk"
            "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$apk"
            actual="$( "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" | head -n1 )"
            test "$actual" = "$expected" || { echo "Paquete inesperado: $actual (esperado $expected)"; exit 1; }
            echo "OK: paquete=$actual"
          done

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: dexterh4ck-apks
          if-no-files-found: error
          retention-days: 14
          path: |
            dexterh4ck-equipos/app/build/outputs/apk/release/*.apk
            dexterh4ck-control/app/build/outputs/apk/release/*.apk
