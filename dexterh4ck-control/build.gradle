// Top-level build file for the Android application.
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:8.2.0"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22"
    }
}

// Dependency repositories are declared centrally in settings.gradle.
// Do not add allprojects.repositories when FAIL_ON_PROJECT_REPOS is enabled.

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
